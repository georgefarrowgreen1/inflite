# inflite.ai and os.inflite.ai: InFlite Today and its workspace shell (today/): their files are today/public;
# only /api/*, /version and the hub's paths
# run the Worker (today/src/index.js), which passes the account's cookie on to account.inflite.ai (the georgefarrowgreen repo's
# functions/_todayapp.js). Workers Builds deploys it from here. Mail is a Worker of its own (email/).
name = "inflite"
main = "today/src/index.js"
compatibility_date = "2026-10-01"
# (only at these custom domains: not at inflite.<account>.workers.dev too, where every write would be refused, its Origin
# not Today's; and no per-version preview addresses)
workers_dev = false
preview_urls = false
# Both hosts use the existing Worker's bindings and secrets. Wrangler provisions the OS hostname's DNS and certificate.
routes = [{ pattern = "inflite.ai", custom_domain = true }, { pattern = "os.inflite.ai", custom_domain = true }]

[assets]
directory = "./today/public"
binding = "ASSETS"
not_found_handling = "404-page"
# (and InFlite's hub, Today First: Chats, Weather, Fitness and Markets at /chats/, /weather/, /fitness/ and /markets/,
# and Mail framed at /mail/; today/src/hub.js and mailhost.js)
run_worker_first = ["/_errors/404", "/api/*", "/version", "/chats", "/chats/*", "/weather", "/weather/*", "/fitness", "/fitness/*", "/markets", "/markets/*", "/mail", "/mail/*"]

[vars]
ACCOUNT_ORIGIN = "https://account.inflite.ai"
# After each host's own same-origin write checks, use the established Today identity at the account service.
TODAY_AS = "https://inflite.ai"
# (InFlite's hub, today/src/hub.js: each app's own address, which the hub speaks as and connects to; Markets is
# finance.'s. HUB_KEY, which the apps' hosts know the hub by, is a secret: npx wrangler secret put HUB_KEY, the same
# value as the Pages project's HUB_KEY secret. Until both are set, and match, every hub path answers 503 and Today
# links to each app's own address, as before)
CHAT_ORIGIN = "https://chat.inflite.ai"
WEATHER_ORIGIN = "https://weather.inflite.ai"
FITNESS_ORIGIN = "https://fitness.inflite.ai"
MARKETS_ORIGIN = "https://finance.inflite.ai"
MAIL_ORIGIN = "https://email.inflite.ai"
AUTH_ORIGIN = "https://auth.inflite.ai"

# (the apps' addresses asked through the inflite-apps Worker directly, not through a fetch, which skips the zone's
# Worker routes: today/src/apps.js)
[[services]]
binding = "APPS"
service = "inflite-apps"

# (and Mail's Worker, for Mail at the hub, /mail/: today/src/mailroof.js asks it directly when this is here)
[[services]]
binding = "MAIL"
service = "inflite-email"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# Everything above is production, the top-level environment: Workers Builds' deploy command for it is
# npx wrangler deploy --env="" (plain npx wrangler deploy deploys the same, with a warning that an environment exists).
# The staging hub (spec §15.2), deployed by hand: npx wrangler deploy --env next. The same Worker at next.inflite.ai,
# whose HUB_KEY secret (npx wrangler secret put HUB_KEY --env next) must be the same value as the Pages project's
# HUB_KEY, as production's is (the apps' hosts know one key), and whose address must be in the Pages project's
# HUB_ORIGINS (https://inflite.ai,https://next.inflite.ai); the account's cookie covers it. TODAY_AS: the site it stands
# in for, whose addresses it takes as its own.
[env.next]
name = "inflite-next"
workers_dev = false
preview_urls = false
routes = [{ pattern = "next.inflite.ai", custom_domain = true }]

[env.next.vars]
ACCOUNT_ORIGIN = "https://account.inflite.ai"
CHAT_ORIGIN = "https://chat.inflite.ai"
WEATHER_ORIGIN = "https://weather.inflite.ai"
FITNESS_ORIGIN = "https://fitness.inflite.ai"
MARKETS_ORIGIN = "https://finance.inflite.ai"
MAIL_ORIGIN = "https://email.inflite.ai"
AUTH_ORIGIN = "https://auth.inflite.ai"
TODAY_AS = "https://inflite.ai"

[[env.next.services]]
binding = "APPS"
service = "inflite-apps"

[[env.next.services]]
binding = "MAIL"
service = "inflite-email"

[env.next.version_metadata]
binding = "CF_VERSION_METADATA"

[env.next.observability]
enabled = true
