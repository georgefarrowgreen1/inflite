name: Atlas staging deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/atlas-integration'
    runs-on: ubuntu-latest
    environment: atlas-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ATLAS_MODEL: ${{ vars.ATLAS_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:atlas
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$OPENAI_API_KEY"
          test -n "$ATLAS_MODEL"
      - name: Provision staging database
        run: node tools/atlas-bind.mjs next
      - name: Apply migrations
        run: npx wrangler d1 migrations apply ATLAS_DB --remote --env next
      - name: Deploy staging with autonomy disabled
        run: npx wrangler deploy --env next
      - name: Configure Atlas secrets
        run: |
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --env next
          printf '%s' "$ATLAS_MODEL" | npx wrangler secret put ATLAS_MODEL --env next
      - name: Verify anonymous access is denied
        run: |
          for path in /atlas /atlas/api/history /atlas/api/tasks; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "https://next.inflite.ai$path")
            test "$status" = 401 || test "$status" = 403 || exit 1
          done
