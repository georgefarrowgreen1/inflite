name: Atlas staging deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/claude/inflite'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: atlas-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:atlas
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Check existing staging Worker secrets
        run: |
          npx wrangler secret list --env next --format json > "$RUNNER_TEMP/atlas-staging-secrets.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const secrets = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/atlas-staging-secrets.json", "utf8"));
          for (const name of ["ATLAS_ENCRYPTION_KEY", "HUB_KEY"]) {
            if (!secrets.some(secret => secret.name === name && secret.type === "secret_text")) {
              throw new Error(name + " must be configured on the inflite-next Worker before staging deployment");
            }
          }
          NODE
      - name: Provision staging database
        run: node tools/atlas-bind.mjs next
      - name: Apply migrations
        run: npx wrangler d1 migrations apply ATLAS_DB --remote --env next
      - name: Deploy staging with autonomy disabled
        run: npx wrangler deploy --env next
      - name: Verify anonymous access is denied
        run: |
          for path in /atlas /atlas/api/chat /atlas/api/provider /atlas/api/history /atlas/api/tasks; do
            status=$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "https://next.inflite.ai$path")
            test "$status" = 401 || test "$status" = 403 || exit 1
          done
