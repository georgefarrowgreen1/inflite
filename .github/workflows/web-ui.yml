name: Web UI checks
on:
  pull_request:
    paths: [today/**, tests/**, package.json, package-lock.json, .github/workflows/web-ui.yml]
  push:
    branches: [claude/inflite]
    paths: [today/**, tests/**, package.json, package-lock.json, .github/workflows/web-ui.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:requests
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
        env:
          WEB_UI_SCREENSHOTS: test-results/web-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-sample-previews
          path: test-results/web-ui
          if-no-files-found: ignore
          retention-days: 14
