name: Web UI checks
on:
  pull_request:
    paths: [today/**, email/**, shared/**, tests/**, package.json, package-lock.json, .github/workflows/web-ui.yml]
  push:
    branches: [claude/inflite]
    paths: [today/**, email/**, shared/**, tests/**, package.json, package-lock.json, .github/workflows/web-ui.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Matching app fixtures
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          R=https://github.com/georgefarrowgreen1/georgefarrowgreen
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$R" "refs/heads/$BRANCH" >/dev/null 2>&1; then B=$BRANCH; else B=$(git ls-remote --symref "$R" HEAD | sed -n 's@^ref: refs/heads/\([^[:space:]]*\).*@\1@p'); fi
          git clone --quiet --depth 1 --branch "$B" "$R" ../georgefarrowgreen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix email --omit=dev --no-audit --no-fund
      - run: npm run test:requests
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:framework
      - run: npm run test:web
        env:
          WEB_UI_SCREENSHOTS: test-results/web-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-sample-previews
          path: test-results/web-ui
          if-no-files-found: ignore
          retention-days: 14
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: inflite
      - name: Matching app modules
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          R=https://github.com/georgefarrowgreen1/georgefarrowgreen
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$R" "refs/heads/$BRANCH" >/dev/null 2>&1; then B=$BRANCH; else B=$(git ls-remote --symref "$R" HEAD | sed -n 's@^ref: refs/heads/\([^[:space:]]*\).*@\1@p'); fi
          git clone --quiet --depth 1 --branch "$B" "$R" georgefarrowgreen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix inflite/email --omit=dev --no-audit --no-fund
      - run: npm ci --prefix georgefarrowgreen/.tools/tests --no-audit --no-fund
      - name: Framework, modules, offline assets and worker boundaries
        working-directory: georgefarrowgreen
        run: node --test --test-concurrency=4 .tools/tests/unit/roof*.test.mjs .tools/tests/unit/today*.test.mjs
