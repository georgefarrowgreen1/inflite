name: Web UI checks
on:
  pull_request:
    paths: [today/**, email/**, shared/**, tests/**, package.json, package-lock.json, .github/workflows/web-ui.yml]
  push:
    branches: [claude/inflite]
    paths: [today/**, email/**, shared/**, tests/**, package.json, package-lock.json, .github/workflows/web-ui.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    # The full six-palette, light/dark, three-intensity material matrix runs here.
    # Includes provisioning Chromium and WebKit and the full palette and viewport matrix.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Production app fixtures
        run: git clone --quiet --depth 1 --branch main https://github.com/georgefarrowgreen1/georgefarrowgreen ../georgefarrowgreen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix email --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm run release:shell -- --check
      - run: npm run release:apps -- --check
      - run: npm run test:requests
      - run: npm run test:api
      - name: Verify pinned browser runtime
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const playwright = require('playwright');
          assert.equal(require('playwright/package.json').version, '1.62.1');
          for (const browser of [playwright.chromium, playwright.webkit]) {
            fs.accessSync(browser.executablePath(), fs.constants.X_OK);
          }
          const bundled = playwright.chromium.executablePath();
          const legacy = '/usr/bin/chromium';
          if (!fs.existsSync(legacy)) fs.symlinkSync(bundled, legacy);
          assert.equal(fs.realpathSync(legacy), fs.realpathSync(bundled));
          NODE
      - run: npm run test:framework
      - name: Private data and window continuity
        run: node --test --test-concurrency=1 tests/mail-private-cache-ui.test.cjs tests/mail-body-security-ui.test.cjs tests/workspace-security-ui.test.cjs tests/workspace-windows-ui.test.cjs
      - run: npm run test:web
        env:
          WEB_UI_SCREENSHOTS: test-results/web-ui
      - name: Launcher navigation and geometry in WebKit
        run: node --test --test-concurrency=1 tests/workspace-launcher-ui.test.cjs tests/launcher420-ui.test.cjs
        env:
          WEB_UI_BROWSER: webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-ui-sample-previews
          path: test-results/web-ui
          if-no-files-found: ignore
          retention-days: 14
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: inflite
      - name: Production app modules
        run: git clone --quiet --depth 1 --branch main https://github.com/georgefarrowgreen1/georgefarrowgreen georgefarrowgreen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --prefix inflite/email --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix georgefarrowgreen/.tools/tests --ignore-scripts --no-audit --no-fund
      - name: Framework, modules, offline assets and worker boundaries
        working-directory: georgefarrowgreen
        run: node --test --test-concurrency=4 .tools/tests/unit/roof*.test.mjs .tools/tests/unit/today*.test.mjs
