name: iOS App Store

on:
  push:
    branches: [codex/ios-beta, claude/inflite]
    tags: ['ios-app-store-*']
    paths:
      - 'ios/**'
      - '.github/scripts/ios-app-store.sh'
      - '.github/workflows/ios-app-store.yml'

permissions:
  contents: read

jobs:
  device-archive:
    if: github.ref_type == 'branch'
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify the iPhone archive
        id: archive
        run: bash .github/scripts/ios-app-store.sh archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InFlite-${{ steps.archive.outputs.version }}-${{ steps.archive.outputs.build }}-iPhone-Archive
          path: ${{ runner.temp }}/InFlite-iPhone-Archive.zip
          if-no-files-found: error
          retention-days: 14

  upload:
    if: startsWith(github.ref, 'refs/tags/ios-app-store-')
    runs-on: macos-26
    timeout-minutes: 25
    environment: app-store
    concurrency:
      group: ios-app-store-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Sign and upload to App Store Connect
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash .github/scripts/ios-app-store.sh upload
